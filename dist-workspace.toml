[workspace]
members = ["cargo:."]

# Releases are built by dist (https://axodotdev.github.io/cargo-dist/). tag.yml
# pushes tag v<version> once release-please's release PR is merged, and
# .github/workflows/release.yml builds, packages and publishes that tag.
# `dist plan` shows what a tag would produce; `dist generate` rewrites
# release.yml after a change here.
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.34.0"
# CI backends to support
ci = "github"
# Where to host releases
hosting = "github"
# Windows x64 and Linux x64. The relink VI stays embedded in lvpm, so nothing
# ships beside the executable.
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]
# A per-user MSI for Windows. The zip and tarball are published too, and
# scripts/install.ps1 installs the zip.
installers = ["msi"]
# gzip rather than xz for the Linux tarball: minimal images (NI's among them)
# need not have xz-utils.
unix-archive = ".tar.gz"
# wix/main.wxs is edited by hand (per-user scope), so dist must not insist
# that it matches what it would generate.
allow-dirty = ["msi"]
# Pull requests only check that the release plan still works; pr.yml is what
# tests them.
pr-run-mode = "plan"
# THIRD-PARTY-LICENSES.txt carries the notices of the crates built into lvpm,
# which their licenses ask a binary distribution to include; lvpm's own
# LICENSE-* files dist adds by itself. It is not in git: release.yml generates
# it with cargo-about before each build (.github/build-setup.yml, about.toml).
include = ["THIRD-PARTY-LICENSES.txt"]
github-build-setup = "../build-setup.yml"

# NI's LabVIEW Linux images run Ubuntu 22.04; a binary built against a newer
# glibc than theirs may not start there.
[dist.github-custom-runners]
x86_64-unknown-linux-gnu = "ubuntu-22.04"
x86_64-pc-windows-msvc = "windows-2022"
