name: Check the pull request

# The bot of labview-package-manager/package-index. On every pull request to
# main it runs `lvpm index check` on the target branch and the pull request's
# files, then merges the pull request when every new version is accepted, or
# comments with the refusal lines. A copy of this file is kept in the lvpm
# repository (docs/vision/community-index/check.yml) so the index can be rebuilt.
#
# The bot merges only a pull request from the owner of what it adds: the author
# is the login of the repo in `github` or a public member of the organisation
# that owns it. Any other pull request is left for a maintainer, with a comment.
# A new name that vipm.io already lists is refused: the index ranks before the
# public indexes, so it would take the name from everyone.
#
# pull_request_target runs this file as it is on the target branch. Nothing from
# the pull request is executed or sourced: its files are checked out as data into
# head/ and only lvpm reads them. Two jobs keep the write token away from that
# work. `check` has a read-only token, reads the pull request and builds the
# verdict. `merge` has the token that can merge and comment, checks out nothing,
# runs no lvpm, and acts only on the verdict `check` hands over.
#
# head/ is the merge GitHub would make (refs/pull/<n>/merge: the index's tip plus
# the pull request), not the pull request's own commit. A branch cut before the
# index's tip then differs from base/ only in the files it changed. If there is
# no merge (the pull request conflicts with the index, or GitHub has not made it
# yet) that checkout is allowed to fail, the verdict is `stale` and the publisher
# gets a comment to re-run the register job, which updates the branch.
#
# LVPM_VERSION below is a guess: confirm it is the release that ships S8 when
# that release is cut. Until then the repository variable LVPM_GIT_REV is set.
# LVPM_SHA256 must be pinned before the bot runs from a release: while it is
# empty the archive is checked only against SHA256SUMS from the same download,
# which whoever replaces the archive replaces too.

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

env:
  # The lvpm that checks. `lvpm index check` is in the first release that ships
  # S8, expected to be 0.25.0 and to be confirmed when it is cut; until then the
  # repository variable LVPM_GIT_REV names an lvpm commit to build instead.
  LVPM_VERSION: "0.25.0"
  # The SHA-256 of that release's linux-x64 archive. The maintainer pins it when
  # 0.25.0 is cut. While it is empty, the archive is checked against SHA256SUMS
  # from the same release, which only catches a damaged download.
  LVPM_SHA256: ""

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # gh verifies attestations with this token; it can only read.
    permissions:
      contents: read
    outputs:
      # stale or error when the check could not run, otherwise lvpm's own verdict:
      # refuse, merge or review. Empty when a step before the verdict failed.
      verdict: ${{ steps.parents.outputs.verdict || steps.check.outputs.verdict }}
      accepted: ${{ steps.check.outputs.accepted }}
      refused: ${{ steps.check.outputs.refused }}
      # lvpm's comment for a pull request it refuses or leaves for review (empty
      # when it has none), base64 so that it is one line.
      comment: ${{ steps.check.outputs.comment }}
    steps:
      - name: Check out the target branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The branch's tip now, not when the pull request was opened.
          ref: ${{ github.event.pull_request.base.ref }}
          path: base
          persist-credentials: false
      - name: Check out the pull request's merge, as data
        id: merge-ref
        # No merge ref (a conflict, or not made yet) is a verdict of its own, below.
        continue-on-error: true
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # From this repository, never the fork: the merge is made here. Depth 2
          # keeps both parents, which the next step compares.
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 2
          path: head
          persist-credentials: false
      - name: Check the merge is of this head and this tip
        id: parents
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_REF: ${{ steps.merge-ref.outcome }}
        run: |
          # GitHub makes the merge a moment after a push, so it can be of an older
          # head or tip. rev-parse only reads commit ids; nothing in head/ runs.
          merged_tip=$(git -C "$GITHUB_WORKSPACE/head" rev-parse 'HEAD^1' 2> /dev/null || true)
          merged_head=$(git -C "$GITHUB_WORKSPACE/head" rev-parse 'HEAD^2' 2> /dev/null || true)
          tip=$(git -C "$GITHUB_WORKSPACE/base" rev-parse HEAD)
          if [ "$MERGE_REF" = failure ] || [ "$merged_head" != "$HEAD_SHA" ] || [ "$merged_tip" != "$tip" ]; then
            echo "verdict=stale" >> "$GITHUB_OUTPUT"
          fi
      - name: Install lvpm
        if: steps.parents.outputs.verdict == '' && vars.LVPM_GIT_REV == ''
        working-directory: ${{ runner.temp }}
        run: |
          archive="lvpm-${LVPM_VERSION}-linux-x64.tar.gz"
          base="https://github.com/ThatsTheEnd/lvpm/releases/download/v${LVPM_VERSION}"
          if [ -n "$LVPM_SHA256" ]; then
            curl --fail --silent --show-error --location --remote-name "$base/$archive"
            echo "$LVPM_SHA256  $archive" | sha256sum -c
          else
            curl --fail --silent --show-error --location --remote-name "$base/$archive" --remote-name "$base/SHA256SUMS"
            grep -F "  $archive" SHA256SUMS | sha256sum --check
          fi
          mkdir lvpm-bin
          tar -xzf "$archive" -C lvpm-bin lvpm
          echo "$RUNNER_TEMP/lvpm-bin" >> "$GITHUB_PATH"
      - name: Build lvpm from a commit
        if: steps.parents.outputs.verdict == '' && vars.LVPM_GIT_REV != ''
        working-directory: ${{ runner.temp }}
        env:
          REV: ${{ vars.LVPM_GIT_REV }}
        run: |
          if [[ ! "$REV" =~ ^[0-9a-f]{40}$ ]]; then
            echo "error: LVPM_GIT_REV must be a full commit id (40 lower-case hex digits)" >&2
            exit 1
          fi
          cargo install --locked --git https://github.com/ThatsTheEnd/lvpm --rev "$REV" --root "$RUNNER_TEMP/lvpm" lvpm
          echo "$RUNNER_TEMP/lvpm/bin" >> "$GITHUB_PATH"
      - name: Check
        id: check
        if: steps.parents.outputs.verdict == ''
        working-directory: ${{ runner.temp }}
        env:
          # gh verifies the attestations with it; lvpm sends no token to downloads.
          GH_TOKEN: ${{ github.token }}
          # The pull request's author, as data: never put into the script text.
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set +e
          lvpm --json index check --base "$GITHUB_WORKSPACE/base" --head "$GITHUB_WORKSPACE/head" --author "$AUTHOR" > check.jsonl
          echo "lvpm exited $?"
          # The last line is {"result": ...} or {"error": ...}.
          tail -n 1 check.jsonl > result.json
          cat result.json
          if ! jq -e '.result' result.json > /dev/null 2>&1; then
            echo "verdict=error" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          accepted=$(jq -r '.result.accepted' result.json)
          refused=$(jq -r '.result.refused' result.json)
          echo "accepted=$accepted" >> "$GITHUB_OUTPUT"
          echo "refused=$refused" >> "$GITHUB_OUTPUT"
          # lvpm decides: refuse, merge or review.
          echo "verdict=$(jq -r '.result.verdict' result.json)" >> "$GITHUB_OUTPUT"
          echo "comment=$(jq -r '.result.comment // empty' result.json | base64 -w 0)" >> "$GITHUB_OUTPUT"

  merge:
    needs: check
    # Not when the run was cancelled (a newer push replaced it); a failed check still comments.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # merge
      pull-requests: write # merge, comment
    steps:
      - name: Merge or comment
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_RESULT: ${{ needs.check.result }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
          VERDICT: ${{ needs.check.outputs.verdict }}
          ACCEPTED: ${{ needs.check.outputs.accepted }}
          REFUSED: ${{ needs.check.outputs.refused }}
          COMMENT: ${{ needs.check.outputs.comment }}
        run: |
          echo "verdict: ${VERDICT:-none}, accepted: ${ACCEPTED:-?}, refused: ${REFUSED:-?}"
          # A verdict from a check job that did not succeed is not one to merge on.
          if [ "$VERDICT" = merge ] && [ "$CHECK_RESULT" != success ]; then
            VERDICT=error
          fi
          case "$VERDICT" in
            refuse)
              printf '%s' "$COMMENT" | base64 -d > comment.md
              gh pr comment "$PR" --repo "$REPO" --body-file comment.md
              exit 1
              ;;
            merge)
              # --match-head-commit pins the branch's head: GitHub refuses if it moved
              # since the check. The squash itself lands on the index's tip as it is
              # now, which can have moved too.
              if ! gh pr merge "$PR" --repo "$REPO" --squash --match-head-commit "$HEAD_SHA"; then
                gh pr comment "$PR" --repo "$REPO" --body "lvpm index check: the index changed while this was checked, so this pull request was not merged. fix: re-run the register job of this tag's workflow run, which updates this pull request, or ask a maintainer to merge it."
                exit 1
              fi
              ;;
            review)
              # lvpm's comment says why, when it has one (the author is not the owner).
              printf '%s' "$COMMENT" | base64 -d > comment.md
              if [ -s comment.md ]; then
                gh pr comment "$PR" --repo "$REPO" --body-file comment.md
              else
                gh pr comment "$PR" --repo "$REPO" --body "lvpm index check: nothing to check. This pull request adds no version, so a maintainer reviews it."
              fi
              ;;
            stale)
              gh pr comment "$PR" --repo "$REPO" --body "lvpm index check could not check this pull request: GitHub has no merge of it with the index's current tip (it is not made yet, or the pull request conflicts), or the merge is of an older tip or branch. fix: re-run the register job of this tag's workflow run, which updates this pull request, or ask a maintainer to check it again."
              exit 1
              ;;
            *)
              gh pr comment "$PR" --repo "$REPO" --body "lvpm index check could not run on this pull request. A maintainer will look at the job log."
              exit 1
              ;;
          esac
