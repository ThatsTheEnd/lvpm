name: Build

# pr.yml's build: the release binaries, checked to run and report the version.
# Releases are built by dist (release.yml) from the same Cargo.toml.
on:
  workflow_call:
    inputs:
      ref:
        description: The commit to check out; empty means the commit that triggered the run
        type: string
        default: ''
      acceptance:
        description: Also build the acceptance tests for the Windows LabVIEW container
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows, runner: windows-2022, bin: lvpm.exe }
          # NI's LabVIEW Linux images run Ubuntu 22.04; a binary built against a
          # newer glibc than theirs may not start there.
          - { os: linux, runner: ubuntu-22.04, bin: lvpm }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal && rustup default stable
        shell: bash
      # Keyed on the runner image, not the os: C objects in a target/ built
      # against a newer glibc do not link on an older one.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: build-${{ matrix.runner }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: build-${{ matrix.runner }}-
      - name: cargo build --release
        run: cargo build --release --locked
        shell: bash
      - name: Check the binary runs and reports the workspace version
        run: |
          want=$(bash ci/version-check.sh --print-version)
          got=$(target/release/${{ matrix.bin }} --version)
          echo "$got"
          [[ "$got" == *"$want"* ]] || { echo "::error::lvpm --version printed '$got', expected $want"; exit 1; }
        shell: bash
      - name: Install the build with install.ps1, as from a release zip
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'lvpm-x86_64-pc-windows-msvc.zip'
          Compress-Archive target/release/lvpm.exe $zip
          $prefix = Join-Path $env:RUNNER_TEMP 'lvpm-install'
          ./scripts/install.ps1 -Archive $zip -Sha256 (Get-FileHash $zip).Hash -InstallDir $prefix -NoPath
      - uses: actions/upload-artifact@v4
        with:
          name: lvpm-${{ matrix.os }}
          path: target/release/${{ matrix.bin }}
          if-no-files-found: error
          retention-days: 7
          overwrite: true
      # CARGO_MANIFEST_DIR and CARGO_BIN_EXE_lvpm are fixed at compile time, so
      # the tests are built at the path the container mounts them at.
      - name: Build the acceptance tests at C:\src\lvpm
        if: inputs.acceptance && matrix.os == 'windows'
        shell: pwsh
        run: |
          robocopy . C:\src\lvpm /E /XD target .git /NFL /NDL /NJH /NJS /NP | Out-Null
          if ($LASTEXITCODE -ge 8) { exit $LASTEXITCODE }
          # -p lvpm: lvpm-tui has an `acceptance` test too, and the e2e script runs the one binary.
          # Cargo names the test binary's path; since Rust 1.100 it is no longer under deps.
          $exe = cargo test --manifest-path C:\src\lvpm\Cargo.toml -p lvpm --test acceptance --no-run --locked --message-format=json |
            ConvertFrom-Json |
            Where-Object { $_.reason -eq 'compiler-artifact' -and $_.target.name -eq 'acceptance' -and $_.executable } |
            Select-Object -Last 1 -ExpandProperty executable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not $exe) { throw 'cargo reported no acceptance test executable' }
          Copy-Item $exe C:/src/lvpm/target/acceptance.exe
      - uses: actions/upload-artifact@v4
        if: inputs.acceptance && matrix.os == 'windows'
        with:
          name: lvpm-acceptance
          path: |
            C:/src/lvpm/target/debug/lvpm.exe
            C:/src/lvpm/target/acceptance.exe
            C:/src/lvpm/tests
          if-no-files-found: error
          retention-days: 7
          overwrite: true
