name: PR title

# PRs are squash-merged, so the title becomes the commit release-please reads:
# feat raises the minor version, fix the patch, `!` or BREAKING CHANGE the
# minor while the major is 0. A title it cannot parse releases nothing.
on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  title:
    name: conventional title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the title is a conventional commit
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          re='^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert|style)(\([^)]+\))?!?: .+'
          [[ "$TITLE" =~ $re ]] && { echo "ok: $TITLE"; exit 0; }
          echo "::error::PR title '$TITLE' is not a conventional commit, e.g. 'feat(sources): ...' or 'fix: ...'."
          exit 1
