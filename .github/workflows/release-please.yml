name: Release PR

# Keeps one open release PR that raises the version in Cargo.toml and
# Cargo.lock and writes CHANGELOG.md from the conventional-commit titles merged
# since the last release. Merging it is what releases: release.yml then sees an
# untagged version and publishes it. release-please creates no tag or release
# itself (skip-github-release); release.yml does both.
# It also runs after each Release run: a merge that lands while the merged
# release PR is still labelled pending opens nothing, so it is retried once
# release.yml has moved the label to tagged.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]

concurrency:
  group: release-please
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-pr:
    name: release PR
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # A PR opened with GITHUB_TOKEN triggers no workflows, so its ci-ok would
      # never run: the token must be a PAT or app token with contents and
      # pull-requests write.
      - id: release
        uses: googleapis/release-please-action@8b8fd2cc23b2e18957157a9d923d75aa0c6f6ad5 # v4.4.1
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          skip-github-release: true
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # release-please cannot edit Cargo.lock's [[package]] entries, so the
      # lock is refreshed on the release branch; CI's --locked fails without it.
      # Pushed with the same token, so the push runs CI on the release PR.
      - if: steps.release.outputs.pr
        uses: actions/checkout@v4
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
      - if: steps.release.outputs.pr
        run: |
          cargo update --workspace
          git diff --quiet Cargo.lock && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh Cargo.lock" Cargo.lock
          git push
